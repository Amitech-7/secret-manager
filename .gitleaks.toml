# Extends gitleaks' built-in rules. Only the exceptions below are added.
[extend]
useDefault = true

[[allowlists]]
description = "Deliberately weak passwords used as inputs to the password-strength tests"
targetRules = ["generic-api-key"]
# [/\\] matches both "/" and "\" so the rule works on Windows and Linux paths alike.
paths = ['''packages[/\\]client[/\\]src[/\\]strength\.test\.ts''']
